# 6 轴单臂的控制器配置（对照 OpenArm 的 openarm_bimanual_controllers.yaml）
#
# 与 OpenArm 的差异：
#   · 只保留单臂（去掉 right_* 与两个 gripper controller）
#   · update_rate 750 -> 250：USB-CANFD + 非实时 Linux，先稳再提
#   · 控制器改名 hw_arm_controller（原 left_joint_trajectory_controller）

controller_manager:
  ros__parameters:
    update_rate: 250  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hw_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hw_arm_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

hw_arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

    # ── ★ R8：到位容差 ─────────────────────────────────────
    #
    # 不配这两项时 JTC 的默认值是 **0**，而源码写着
    #   "A tolerance value of zero means that no tolerance will be applied"
    #   （tolerances.hpp:48-50；309-311 行只有 >0 才参与判定）
    # 于是"时间到了 + 速度接近零"就算成功 —— 关节根本没跟上也报 SUCCEEDED。
    #
    # 数值按当前真机精度定：先给 3°(goal) / 5°(path) 这种宽松值，
    # 实测重复性后再收紧；不要照抄别人的 0.01 rad。
    #   trajectory = 运动过程中允许的跟踪误差
    #   goal       = 终点允许的稳态误差
    constraints:
      stopped_velocity_tolerance: 0.02   # rad/s，判定"停住"的速度阈值
      goal_time: 1.0                     # s，到点后允许再调多久
      joint1: { trajectory: 0.09, goal: 0.05 }
      joint2: { trajectory: 0.09, goal: 0.05 }
      joint3: { trajectory: 0.09, goal: 0.05 }
      joint4: { trajectory: 0.09, goal: 0.05 }
      joint5: { trajectory: 0.09, goal: 0.05 }
      joint6: { trajectory: 0.09, goal: 0.05 }

hw_arm_forward_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: position

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
