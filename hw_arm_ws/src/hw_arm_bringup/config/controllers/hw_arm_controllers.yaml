# 6 轴单臂的控制器配置（对照 OpenArm 的 openarm_bimanual_controllers.yaml）
#
# 与 OpenArm 的差异：
#   · 只保留单臂（去掉 right_* 与两个 gripper controller）
#   · update_rate 750 -> 250：USB-CANFD + 非实时 Linux，先稳再提
#   · 控制器改名 hw_arm_controller（原 left_joint_trajectory_controller）

controller_manager:
  ros__parameters:
    update_rate: 250  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hw_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hw_arm_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

hw_arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

hw_arm_forward_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: position

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
