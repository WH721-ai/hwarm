    peak_phase_current: 95.0       # A
    t_rated: 40.0                  # N·m  ★ 说明书 40（原代码写 20，偏低）
    t_peak: 120.0                  # N·m  ★ 说明书 120（原代码写 200，那是协议量程）
    rated_speed_rpm: 100.0         # @48V（24V 时 70）
    no_load_speed_rpm: 200.0       # @48V（24V 时 100）
    gear_ratio: 10.0
    pole_pairs: 21
    phase_inductance_uH: 85.0
    phase_resistance_ohm: 0.11
    diameter_mm: 120.0
    height_mm: 53.0
    mass_g: 1372.0
    encoder_bits: 14
    encoder_count: 2
