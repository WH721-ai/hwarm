# ─────────────────────────────────────────────────────────────
# 转子惯量：说明书里没有，已从固件 RID 12 实读（2026-11-22）
# ─────────────────────────────────────────────────────────────
#
#   ID  型号         J_rotor(kg·m²)   Gr    armature = Gr²·J
#    1  DM10010L     5.22555e-04     10    5.22555e-02
#    2  DM6216P      2.91326e-05     16    7.45795e-03
#    3  DM4340       1.81064e-05     40    2.89702e-02
#    4  DM4310P      2.03553e-05     10    2.03553e-03
#    5  DM4310       1.78233e-05     10    1.78233e-03
#    6  DM4310       1.76423e-05     10    1.76423e-03
#
#   自洽性检查（转子惯量 ∝ 直径⁵ 量级）：
#     DM10010L(120mm) / DM4310(57mm) = 5.23e-4/1.76e-5 = 29.6×，
#     而 (120/57)^5 = 41× —— 同量级 ✅
#     DM6216P(67mm) / DM4340(57mm) = 2.91e-5/1.81e-5 = 1.61×，
#     (67/57)^5 = 2.2× —— 同量级 ✅
#     DM4310 与 DM4340 同 57mm 机座，转子惯量 1.76e-5 vs 1.81e-5 几乎相同 ✅
#
#   ⚠️ 旧的 armature（hw_arm_mujoco/scripts/urdf_to_mjcf.py 里的
#      [0.01, 0.01, 0.16, 0.01, 0.01, 0.01]）与实测差很多：
#        j1 0.010 → 0.0523（低估 5×）
#        j3 0.160 → 0.0290（高估 5.5×）
#        j4/j5/j6 0.010 → 0.0020/0.0018/0.0018（高估 5×）
#
#   加进 URDF 后 M 的变化（q=(0,0.8,0.4,0,0.6,0)）：
#        加之前：[0.0335, 0.1358, 0.0806, 0.00105, 0.00150, 0.0]
#        加之后：[0.0864, 0.1740, 0.1113, 0.00399, 0.00328, 0.00177]
#        cond(M) 2.4e5 → 182   ← 从"接近奇异"变成"可用"
#
# ─────────────────────────────────────────────────────────────
# 原始记录（保留）
# 五份说明书的技术参数表都没有"转动惯量"这一项。
# 唯一的来源是固件寄存器：
#
#     RID 11  Damp      电机粘滞系数   RO   float
#     RID 12  Inertia   电机转动惯量   RO   float
#
# （DM6216P 说明书 V1.5 第 787~793 行、DM4310P 第 638 行、
#   DM4340 第 652 行、DM10010L 第 473 行 都列出了这两个 RID）
#
# ⚠️ 但 read_motor_registers.py 的显示精度是 %.4f，
#    2026-11-22 实读得到：
#         ID1 = 0.0005      ID2~ID6 = 0.0000
#    转子惯量量级约 1e-5 ~ 1e-3 kg·m²，**1e-5 会被四舍五入成 0.0000**。
#    → 必须用全精度重新读一次（CAN 恢复后）：
#
#        python3 tools/dump_register_f32.py --ids 1,2,3,4,5,6 --rid 12
#
# 单位推断：说明书写"位置/速度/力矩都是输出轴口径"，
#   若 RID 12 同口径（kg·m² @ 输出轴），则 armature = rotor_inertia 直接可用；
#   若为电机侧，则 armature = Gr² · rotor_inertia。
#   实读后再确认。
#
# 拿不到时的兜底估计（来自 hw_arm_mujoco/scripts/urdf_to_mjcf.py:73 的 armature）：
#     j1 0.010  j2 0.010  j3 0.160  j4 0.010  j5 0.010  j6 0.010
#   其中 DM4310/DM4340 那几项是 OpenArm 的实测值，j1/j2 是占位。
