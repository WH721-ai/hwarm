# 电机规格表（单一数据源）
# ─────────────────────────────────────────────────────────────
# 来源：
#   ① 说明书 PDF（/mnt/hgfs/VMshare/）
#        DM-J10010L-2EC减速电机说明书V1.1.pdf
#        DM-J6216P-2EC 减速电机说明书V1.5 2026-10-26.pdf
#        DM-J4340-2ECV1.1减速电机说明书 V1.2.pdf
#        DM-J4310P-2EC减速电机说明书V1.1 定稿(2).pdf
#        DM-J4310-2EC V1.1减速电机说明书V1.0.pdf
#   ② 电机固件寄存器实读（read_motor_registers.py，2026-11-22）
#        RID 20 Gr / 21 PMAX / 22 VMAX / 23 TMAX
#
# ⚠️ 三个"最大力矩"不是一回事，别混：
#     额定 t_rated     能长期连续输出（不烧电机）      ← 选型 / 加速度上限用这个
#     峰值 t_peak      短时间能冲到的                   ← 过载判断
#     协议 t_protocol  固件 RID23，MIT 12bit 字段的量程  ← 下发的编码上限
#   实际出力上限 = min(t_peak, t_protocol)
#
# ⚠️ 所有力矩 / 位置 / 速度都是**输出轴（减速后）**口径，
#    这是 DM 说明书明确写的（DM6216P 说明书第 468~474 行）。
#
# ⚠️ rotor_inertia / armature 暂时留空 —— 见文件末尾说明。

