# 关节限位（能转多少）
#
# 2026-11-20 按**真机手动标定**更新（scripts/calibrate_limits.py）：
#   把每个关节用手推到两端，记录编码器读数（已乘 direction，关节坐标系）。
#   effort / velocity 保持不变。
#
#   joint        下限        上限      行程      说明
#   joint1     -π          +π        360.0°   连转关节，实测 364.7°，按 360° 处理
#   joint2     -0.0017     +3.1034   177.9°   实测（CAD 说 200°，真机到不了）
#   joint3     +0.0105     +3.0364   173.4°   实测（CAD 说 140°，真机更宽）
#   joint4     -3.3522     +0.5262   222.2°   实测（上限只到 +30°）
#   joint5     -1.2037     +1.1896   137.1°   实测（CAD 说 ±45°）
#   joint6     -2π         +2π        720.0°   **无结构限位**，可随意连续转；
#                                              放宽到 ±2π（见文件末尾说明）
#
# ⚠️ 除 joint1/joint6 外，其余各轴在实测值上各加了 **2° 余量**：
#    实测端点是"推到推不动"的位置，重复测量有 ±1° 误差；
#    而且标定时 joint2/joint3 的静止位比标定下限还低 0.3~0.9°，
#    说明端点没真正压到硬限位。加 2° 后保证 0°（home）一定在范围内。
#
# ⚠️ joint6 是**完全没有结构限位**的连续关节（用户可以任意方向一直转）。
#    没有用 URDF 的 type="continuous"，原因见下面 joint1 那段。
#    取 ±2π（±360°）而不是 ±π，是为了留出连续转的余量；
#    也不能取更大 —— DM 电机编码器量程 ±12.5 rad（±716°），
#    超过会回绕，读数出现 1432° 的跳变，比限位更危险。
#
# ⚠️ joint1 / joint6 是**连转**关节。这里用 ±π 而不是 URDF 的 continuous，
#    因为 continuous 在 Pinocchio 里会变成 nq=2（cos/sin 两维），
#    整个 6 自由度假设都会崩掉（算法、硬件映射、MuJoCo 转换全部要改）。
#
# effort 单位 N·m，velocity 单位 rad/s。

