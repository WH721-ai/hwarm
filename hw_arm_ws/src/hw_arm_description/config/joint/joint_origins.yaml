# 世界 → base_link：绕 X 轴转 180°
# 目的：让 base_link 的 +z 与重力方向一致（CAD 是 z_up，重力沿 -z）
# z=0.03：把整机抬高 30mm，让底座完全落在 ground(z=0) 之上
#       （实测最低点是底座底面 z=-27.6mm，抬高 30mm 后留 2.4mm 余量）
# 注意：平移不改变任何关节力矩（g(q) 完全不变），只影响世界系里的位置。
world_joint:
  origin:
    x: 0.0
    y: 0.0
    z: 0.03
    roll: 3.141592653589793
    pitch: 0.0
    yaw: 0.0
